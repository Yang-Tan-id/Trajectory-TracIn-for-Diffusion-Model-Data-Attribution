[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-diffusion-artbench-pytorch"
version = "0.1.0"
description = "PyTorch/Diffusers reproduction scaffold for D-TRAK on ArtBench-2"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

